name: University of Padua
x-type: university
x-category: Public Research University
description: >-
  The University of Padua (Università degli Studi di Padova) is a public research university in
  Padua, Italy, founded in 1222. It operates no central developer portal and publishes no
  institution-authored API contract: an "API first" programme exists internally, routed through
  the IUNGO integration infrastructure and a GovWay API gateway, but the catalogue of REST web
  services it promises is not public and access runs through a helpdesk ticket. What Padua does
  operate, and what this profile records, is protocol infrastructure rather than product APIs —
  four live OAI-PMH 2.0 endpoints on its own hosts (the IRIS research catalogue, the Research
  Data Unipd data archive, the theses archive, and PHAIDRA), and a Shibboleth Identity Provider
  publishing SAML 2.0 metadata into the IDEM GARR federation and eduGAIN. The one documented
  REST API on a Padua host, PHAIDRA's, is the contract of the PHAIDRA open-source repository
  platform developed at the University of Vienna, not Padua engineering; it is recorded here as
  a deployment and its specification is deliberately not held under this slug. An institutional
  Open Data portal was announced in December 2024 but has not launched — no open-data host
  resolves. There is no institutional GitHub organisation; github.com/unipd exists but holds
  zero public repositories.
