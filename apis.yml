x-coverage:
  state: covered
  reason: covered
  detail: >-
    Probed 2026-08-30 across every surface class a university actually operates. The University of
    Padua publishes no institution-authored API contract and no developer portal. Its "API first"
    programme is real but internal: the Applications Office routes integrations through IUNGO and a
    GovWay API gateway, and the promised catalogue of REST web services is reachable only by
    helpdesk ticket, with no public URL or documentation. The Open Data portal announced by ASIT in
    December 2024 has not launched — dati.unipd.it and opendata.unipd.it do not resolve, and
    www.unipd.it/opendata redirects to the homepage. The former course/timetable host
    didattica.unipd.it now serves a "dismesso" (decommissioned) notice; the student system at
    uniweb.unipd.it is a Cineca ESSE3 tenant with no public interface. What Padua does operate is
    protocol infrastructure: four live OAI-PMH 2.0 endpoints on its own hosts and a Shibboleth IdP
    publishing SAML 2.0 metadata into IDEM GARR / eduGAIN. The one documented REST API on a Padua
    host is PHAIDRA's, and PHAIDRA is an open-source platform from the University of Vienna shipped
    identically by other institutions, so its contract is recorded as a tenant-style deployment and
    is not held under this slug. www.unipd.it answers HTTP 200 with the homepage for every unknown
    path, so security.txt and llms.txt read as present by status code and are absent in fact.
  evidence:
  - url: https://phaidra.unipd.it/api/openapi/json
    status: 200
    note: >-
      Live PHAIDRA OpenAPI, 180,319 bytes application/json. Title "PHAIDRA … API"; the same
      document ships at University of Vienna. Product contract, not Padua's — not saved here.
  - url: https://phaidra.unipd.it/
    status: 200
    note: >-
      Page source carries the comment "This repository is powered by PHAIDRA — free open source
      software", stating the platform's third-party origin in the institution's own markup.
  - url: https://shibidp.cca.unipd.it/idp/shibboleth
    status: 200
    note: >-
      SAML 2.0 / Shibboleth IdP metadata, application/xml, 17,853 bytes, entityID
      https://shibidp.cca.unipd.it/idp/shibboleth, OrganizationName "Università degli Studi di
      Padova". Institution-operated. The strongest artifact in this profile.
  - url: https://www.research.unipd.it/oai/request?verb=Identify
    status: 200
    note: OAI-PMH 2.0, repositoryName "IRIS - UNIPD - prod". Institution-hosted.
  - url: https://researchdata.cab.unipd.it/cgi/oai2?verb=Identify
    status: 200
    note: >-
      OAI-PMH 2.0, repositoryName "Research Data Unipd"; ListMetadataFormats offers oai_datacite.
