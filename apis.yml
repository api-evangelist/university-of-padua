  - url: https://thesis.unipd.it/oai/request?verb=Identify
    status: 200
    note: OAI-PMH 2.0 for the theses archive; ListMetadataFormats offers datacite. Newly found.
  - url: https://thesis.unipd.it/cgi/oai2?verb=Identify
    status: 200
    note: Soft-404 — HTTP 200 serving error404.htm. Status code alone is not evidence on this host.
