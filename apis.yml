- aid: university-of-padua:researchdata-oai
  name: Research Data Unipd OAI-PMH
  description: >-
    Research Data Unipd is the EPrints-based research-data archive of the University of Padua, supporting
    data discovery, sharing, and reuse using DataCite and Dublin Core metadata. It is an OpenAIRE content
    provider and is registered in re3data, OpenDOAR, and FAIRsharing. Exposes an OAI-PMH 2.0 endpoint
    (repositoryName "Research Data Unipd"), verified live at time of review.
  humanURL: https://researchdata.cab.unipd.it/
