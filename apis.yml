- aid: university-of-padua:phaidra-unipd
  name: PHAIDRA at Padua (deployment)
  description: >-
    PHAIDRA is the University of Padua Library System's digital-collections repository, holding the
    institution's digitised images, documents, books and video. The data, the objects and the
    persistent identifiers are Padua's, and the service runs on Padua's own infrastructure at
    phaidra.unipd.it (phaidra.cab.unipd.it redirects there). The REST API it exposes — including its
    IIIF image server at /api/imageserver and its OAI-PMH endpoint at /api/oai — is the contract of
    the PHAIDRA open-source repository platform developed at the University of Vienna
    (github.com/phaidra/phaidra-api, Apache-2.0), shipped identically by other PHAIDRA institutions.
    The page source at phaidra.unipd.it states it itself: "This repository is powered by PHAIDRA —
    free open source software". The deployment is recorded here; the product's specification is not
    held under this slug, because it is not Padua's engineering to be credited with.
