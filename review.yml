  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-reviewed under the API Evangelist university pipeline, whose first question is not
      "is there a spec" but "who operates the thing the spec describes". The June 2026 review
      credited the University of Padua with fourteen OpenAPI definitions. Every one of them is
      the contract of PHAIDRA, an open-source repository platform developed at the University
      of Vienna and shipped identically by other PHAIDRA institutions; phaidra.unipd.it says so
      in its own page source. Those fourteen specs and the 43 artifacts derived from them were
      removed, and the PHAIDRA deployment is now recorded as a single tenant-style entry — the
      data and the objects are Padua's, the contract is not. What survives is real and was
      probed live: four institution-hosted OAI-PMH 2.0 endpoints (IRIS UNIPD, Research Data
      Unipd, the theses archive, PHAIDRA) and a Shibboleth Identity Provider publishing SAML 2.0
      metadata into IDEM GARR and eduGAIN, which is the most complete machine-readable artifact
      the institution publishes. Two corrections to the June profile: the Padua@Research
      OAI-PMH endpoint is dead and was removed, and the theses archive endpoint was missed
      entirely and has been added. Padua publishes no institution-authored API contract, no
      developer portal, and no open data portal — the one announced in December 2024 has not
      launched. Its "API first" programme is internal, behind IUNGO and a GovWay gateway,
      reachable only by helpdesk ticket. The lower rating is the correction, not a decline.
